<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: página no encontrada | MailMask</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/theme.js"></script>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: rgb(var(--bg)); color: rgb(var(--fg)); font-family: Inter, system-ui, sans-serif; }
      header { padding: 20px 32px; }
      .logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: inherit; text-decoration: none; }
      main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: center; width: 100%; max-width: 70rem; margin: 0 auto; padding: 8px 32px 32px; box-sizing: border-box; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgb(var(--accent-text)); margin: 0; }
      h1 { font-family: "Bricolage Grotesque", Inter, system-ui, sans-serif; font-size: clamp(2.25rem, 5vw, 3.75rem); font-weight: 800; line-height: 1.02; letter-spacing: -0.03em; text-wrap: balance; margin: 12px 0 16px; }
      .lead { font-size: 1.125rem; line-height: 1.5; color: rgb(var(--fg-muted)); max-width: 28rem; margin: 0 0 24px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
      .btn { display: inline-block; padding: 13px 24px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; }
      .btn:focus-visible, .more a:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 3px; }
      .btn-primary { background: rgb(var(--accent)); color: #fff; }
      .btn-primary:hover { background: rgb(var(--accent-text)); }
      .btn-secondary { border: 2px solid rgb(var(--line)); background: rgb(var(--bg-elev)); color: rgb(var(--fg)); }
      .btn-secondary:hover { border-color: rgb(var(--fg-subtle)); }
      .more { font-size: 14px; color: rgb(var(--fg-muted)); margin: 0; }
      .more a { color: inherit; text-decoration: underline; }
      figure { margin: 0; border: 1px solid rgb(var(--line)); border-radius: 20px; overflow: hidden; background: #faf6ee; box-shadow: 0 18px 0 -10px rgb(var(--line)); }
      figure img { display: block; width: 100%; height: auto; }
      footer { padding: 18px; text-align: center; font-size: 12px; color: rgb(var(--fg-subtle)); }
      footer a { color: inherit; }
      @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 8px 20px 24px; } }
    </style>
  </head>
  <body>
    <header>
      <a class="logo" href="/">
        <svg width="34" height="34" viewBox="0 0 80 80" fill="none" aria-hidden="true">
          <ellipse cx="40" cy="42" rx="28" ry="24" fill="rgb(var(--mascara-sombra))" />
          <ellipse cx="40" cy="38" rx="28" ry="22" fill="rgb(var(--mascara))" />
          <ellipse cx="28" cy="36" rx="8" ry="6.3" fill="#ffffff" stroke="rgb(var(--gold))" stroke-width="1.8" />
          <ellipse cx="52" cy="36" rx="8" ry="6.3" fill="#ffffff" stroke="rgb(var(--gold))" stroke-width="1.8" />
          <circle cx="28.6" cy="36.4" r="5.2" fill="#a97142" />
          <circle cx="52.6" cy="36.4" r="5.2" fill="#a97142" />
          <circle cx="28.6" cy="36.4" r="2.6" fill="#3b2412" />
          <circle cx="52.6" cy="36.4" r="2.6" fill="#3b2412" />
        </svg>
        MailMask
      </a>
    </header>

    <main>
      <section>
        <p class="eyebrow">Error 404</p>
        <h1>Buscamos en todos los cajones</h1>
        <p class="lead">Esta página no está en el archivo. Quizá la movimos o nunca existió. Prueba por aquí:</p>
        <div class="actions">
          <a class="btn btn-primary" href="/">Ir al inicio</a>
          <a class="btn btn-secondary" href="/docs">Documentación</a>
        </div>
        <p class="more">También: <a href="/pricing">Precios</a> · <a href="/blog">Blog</a> · <a href="/register">Crear cuenta</a></p>
      </section>
      <figure>
        <img src="/img/404-il.jpg" alt="Un luchador enmascarado con lupa busca entre cajones de sobres; en el suelo hay un sobre con sello 404" width="1200" height="800" fetchpriority="high" />
      </figure>
    </main>

    <footer>© 2026 MailMask · <a href="/">mailmask.studio</a></footer>
  </body>
</html>
