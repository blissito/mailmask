  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="250" cy="150" rx="520" ry="420" fill="url(#glow)"/>

  <!-- Logo: same mask mark as favicon.svg, scaled 2.6x and centred at (150, 168) -->
