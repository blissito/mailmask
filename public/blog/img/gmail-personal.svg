<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="hiloT hiloD" style="display:block">
            <title id="hiloT">Comparación: la conversación partida en dos contra la conversación completa</title>
            <desc id="hiloD">A la izquierda, escribes desde Gmail y la respuesta del cliente llega a tu buzón personal, fuera del dominio. A la derecha, escribes desde tu dominio y la respuesta cae en la misma conversación.</desc>

            <!-- ===== IZQUIERDA: partida ===== -->
            <text x="16" y="22" fill="#d97757" font-family="system-ui,sans-serif" font-size="13" font-weight="700">DESDE TU GMAIL</text>

            <rect x="16" y="36" width="352" height="150" rx="8" fill="#141417" stroke="#3f3f46" />
            <text x="32" y="60" fill="#71717a" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1">TU GMAIL PERSONAL</text>
            <rect x="32" y="72" width="240" height="34" rx="8" fill="#1f1f23" stroke="#52525b" />
            <text x="44" y="94" fill="#d4d4d8" font-family="system-ui,sans-serif" font-size="12">tunombre87@gmail.com → cliente</text>
            <rect x="112" y="118" width="240" height="34" rx="8" fill="#1f1f23" stroke="#d97757" />
            <text x="124" y="140" fill="#d4d4d8" font-family="system-ui,sans-serif" font-size="12">cliente → tu Gmail  (la respuesta)</text>
            <text x="32" y="172" fill="#d97757" font-family="system-ui,sans-serif" font-size="11">queda aquí, entre tus recibos y promociones</text>

            <rect x="16" y="202" width="352" height="118" rx="8" fill="#141417" stroke="#3f3f46" />
            <text x="32" y="226" fill="#71717a" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1">TU DOMINIO</text>
            <rect x="32" y="240" width="320" height="58" rx="8" fill="#18181b" stroke="#3f3f46" stroke-dasharray="5 4" />
            <text x="192" y="266" fill="#52525b" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">sin registro de esta conversación</text>
            <text x="192" y="286" fill="#52525b" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">tu equipo no la ve</text>

            <text x="192" y="352" fill="#d97757" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">2 lugares · 1 conversación rota</text>

            <!-- separador -->
            <line x1="400" y1="30" x2="400" y2="370" stroke="#27272a" stroke-width="1" />

            <!-- ===== DERECHA: completa ===== -->
            <text x="432" y="22" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">DESDE TU DOMINIO</text>

            <rect x="432" y="36" width="352" height="284" rx="8" fill="#141417" stroke="#10b981" stroke-opacity="0.5" />
            <text x="448" y="60" fill="#71717a" font-family="system-ui,sans-serif" font-size="11" letter-spacing="1">BANDEJA DE TU DOMINIO</text>

            <rect x="448" y="72" width="248" height="34" rx="8" fill="#1f1f23" stroke="#52525b" />
            <text x="460" y="94" fill="#d4d4d8" font-family="system-ui,sans-serif" font-size="12">hola@tunegocio.com → cliente</text>

            <rect x="520" y="118" width="248" height="34" rx="8" fill="#1f1f23" stroke="#10b981" />
            <text x="532" y="140" fill="#d4d4d8" font-family="system-ui,sans-serif" font-size="12">cliente → hola@tunegocio.com</text>

            <rect x="448" y="164" width="248" height="34" rx="8" fill="#1f1f23" stroke="#52525b" />
            <text x="460" y="186" fill="#d4d4d8" font-family="system-ui,sans-serif" font-size="12">hola@tunegocio.com → cliente</text>

            <line x1="448" y1="216" x2="768" y2="216" stroke="#27272a" />
            <text x="448" y="240" fill="#10b981" font-family="system-ui,sans-serif" font-size="12">✓ un solo hilo, en orden</text>
            <text x="448" y="262" fill="#10b981" font-family="system-ui,sans-serif" font-size="12">✓ queda en el historial del dominio</text>
            <text x="448" y="284" fill="#10b981" font-family="system-ui,sans-serif" font-size="12">✓ tu equipo puede darle seguimiento</text>

            <text x="608" y="352" fill="#10b981" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">1 lugar · 1 conversación</text>
          </svg>