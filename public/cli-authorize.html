<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorizar CLI | MailMask</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
</head>
<body class="site bg-bg text-fg antialiased min-h-screen flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm card p-7 sm:p-9">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-semibold tracking-tight">Autorizar CLI</h1>
      <p class="text-sm text-fg-muted mt-2">Confirma que este código aparece en tu terminal.</p>
    </div>

    <div id="loading" class="text-center text-sm text-fg-muted py-4">Verificando sesión…</div>

    <div id="anon" class="hidden text-center">
      <p class="text-sm text-fg-muted mb-4">Inicia sesión en MailMask y vuelve a abrir este enlace desde tu terminal.</p>
      <a href="/login" class="btn-primary inline-block">Iniciar sesión</a>
    </div>

    <div id="auth" class="hidden">
      <p class="text-sm text-fg-muted mb-1">Cuenta</p>
      <p class="text-sm font-medium mb-4" data-email></p>
      <label for="user-code" class="block text-sm text-fg-muted mb-1">Código</label>
      <input id="user-code" type="text" autocomplete="off" spellcheck="false" maxlength="9"
        class="w-full bg-bg border border-line rounded-lg px-4 py-3 text-center text-lg font-mono tracking-widest uppercase text-fg focus:border-accent focus:outline-none transition-colors mb-4">
      <div id="error" class="text-red-500 text-sm hidden mb-3"></div>
      <button id="confirm-btn" type="button" class="btn-primary w-full">Autorizar</button>
    </div>

    <div id="done" class="hidden text-center text-sm text-fg py-4">
      Listo. Vuelve a tu terminal.
    </div>
  </div>
  <script src="/js/cli-authorize.js"></script>
</body>
</html>
