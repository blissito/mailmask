<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — MailMask</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/theme.js"></script>
</head>
<body class="site bg-bg text-fg antialiased min-h-screen flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm card p-7 sm:p-9">
    <div class="text-center mb-8">
      <a href="/" class="inline-block">
        <svg class="w-12 h-12 mx-auto" viewBox="0 0 80 80" fill="none" aria-label="MailMask">
          <ellipse cx="40" cy="42" rx="28" ry="24" fill="rgb(var(--mascara-sombra))"/>
          <ellipse cx="40" cy="38" rx="28" ry="22" fill="rgb(var(--mascara))"/>
          <!-- Aberturas de la máscara -->
          <ellipse cx="28" cy="36" rx="8" ry="6.3" fill="#ffffff" stroke="rgb(var(--gold))" stroke-width="1.8"/>
          <ellipse cx="52" cy="36" rx="8" ry="6.3" fill="#ffffff" stroke="rgb(var(--gold))" stroke-width="1.8"/>
          <!-- Iris y pupila -->
          <circle cx="28.6" cy="36.4" r="5.2" fill="#a97142"/>
          <circle cx="52.6" cy="36.4" r="5.2" fill="#a97142"/>
          <circle cx="28.6" cy="36.4" r="2.6" fill="#3b2412"/>
          <circle cx="52.6" cy="36.4" r="2.6" fill="#3b2412"/>
          <!-- Doble brillo: luz y rebote -->
          <circle cx="30.2" cy="34.9" r="1.9" fill="#ffffff"/>
          <circle cx="54.2" cy="34.9" r="1.9" fill="#ffffff"/>
          <circle cx="26.7" cy="38.9" r="1.15" fill="#ffffff" opacity="0.85"/>
          <circle cx="50.7" cy="38.9" r="1.15" fill="#ffffff" opacity="0.85"/>
          <path d="M40 18 L40 26" stroke="rgb(var(--gold))" stroke-width="2" stroke-linecap="round"/>
          <path d="M36 19 L40 26 L44 19" stroke="rgb(var(--gold))" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </a>
      <h1 class="text-2xl font-semibold tracking-tight mt-4">Recuperar contraseña</h1>
      <p class="text-fg-muted text-sm mt-2">Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.</p>
    </div>

    <form id="forgot-form" class="space-y-4">
      <div>
        <label class="block text-sm text-fg-muted mb-1">Email</label>
        <input type="email" name="email" required
          class="w-full bg-bg border border-line rounded-lg px-4 py-3 text-fg placeholder-fg-subtle focus:border-accent focus:outline-none transition-colors"
          placeholder="tu@email.com">
      </div>
      <div id="error" class="text-red-500 text-sm hidden"></div>
      <div id="success" class="text-mask-700 text-sm hidden"></div>
      <button type="submit"
        class="w-full btn-primary w-full">
        Enviar enlace
      </button>
    </form>

    <p class="text-center text-sm text-fg-subtle mt-6">
      <a href="/login" class="text-accent-text hover:underline">Volver a iniciar sesión</a>
    </p>
  </div>

  <script src="/js/forgot-password.js"></script>
</body>
</html>
