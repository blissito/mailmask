<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configura tu contraseña — MailMask</title>
  <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body class="site bg-bg text-fg antialiased min-h-screen flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm card p-7 sm:p-9">
      <div class="text-center mb-8">
        <a href="/" class="inline-block">
          <svg class="w-12 h-12 mx-auto" viewBox="0 0 80 80" fill="none" aria-label="MailMask">
            <ellipse cx="40" cy="42" rx="28" ry="24" fill="rgb(var(--mascara-sombra))" />
            <ellipse cx="40" cy="38" rx="28" ry="22" fill="rgb(var(--mascara))" />
            <!-- Aberturas de la máscara -->
            <ellipse cx="28" cy="36" rx="8" ry="6.3" fill="#ffffff" stroke="rgb(var(--gold))" stroke-width="1.8"/>
            <ellipse cx="52" cy="36" rx="8" ry="6.3" fill="#ffffff" stroke="rgb(var(--gold))" stroke-width="1.8"/>
            <!-- Iris y pupila -->
            <circle cx="28.6" cy="36.4" r="5.2" fill="#a97142"/>
            <circle cx="52.6" cy="36.4" r="5.2" fill="#a97142"/>
            <circle cx="28.6" cy="36.4" r="2.6" fill="#3b2412"/>
            <circle cx="52.6" cy="36.4" r="2.6" fill="#3b2412"/>
            <!-- Doble brillo: luz y rebote -->
            <circle cx="30.2" cy="34.9" r="1.9" fill="#ffffff"/>
            <circle cx="54.2" cy="34.9" r="1.9" fill="#ffffff"/>
            <circle cx="26.7" cy="38.9" r="1.15" fill="#ffffff" opacity="0.85"/>
            <circle cx="50.7" cy="38.9" r="1.15" fill="#ffffff" opacity="0.85"/>
            <path d="M40 18 L40 26" stroke="rgb(var(--gold))" stroke-width="2" stroke-linecap="round" />
            <path d="M36 19 L40 26 L44 19" stroke="rgb(var(--gold))" stroke-width="1.5" fill="none" stroke-linecap="round" />
          </svg>
        </a>
        <h1 class="text-2xl font-semibold tracking-tight mt-4">Configura tu contraseña</h1>
        <p class="text-fg-muted text-sm mt-2">Elige una contraseña para acceder a tu cuenta de MailMask.</p>
      </div>

      <form id="form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-fg mb-1">Contraseña</label>
          <div class="relative">
            <input type="password" id="password" minlength="8" required
              class="w-full bg-bg border border-line rounded-lg px-4 py-3 pr-12 text-fg placeholder-fg-subtle focus:border-accent focus:outline-none transition-colors" />
            <button type="button" class="absolute inset-y-0 right-0 flex items-center px-3 text-accent-text hover:text-accent-text transition-colors" data-toggle-password>
              <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
              <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-fg mb-1">Confirmar contraseña</label>
          <div class="relative">
            <input type="password" id="confirm" minlength="8" required
              class="w-full bg-bg border border-line rounded-lg px-4 py-3 pr-12 text-fg placeholder-fg-subtle focus:border-accent focus:outline-none transition-colors" />
            <button type="button" class="absolute inset-y-0 right-0 flex items-center px-3 text-accent-text hover:text-accent-text transition-colors" data-toggle-password>
              <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
              <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
        </div>
        <p id="error" class="text-red-500 text-sm hidden"></p>
        <button type="submit" id="btn"
          class="w-full btn-primary w-full disabled:opacity-50">
          Guardar contraseña
        </button>
      </form>
    </div>

    <script src="/js/toggle-password.js"></script>
    <script src="/js/set-password.js"></script>
  </body>
</html>
