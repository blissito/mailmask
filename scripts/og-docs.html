<!DOCTYPE html>
<!--
  Plantilla de la imagen social de /docs (public/img/og-docs.jpg, 1200×630).
  No se hace con IA: se renderiza con Chromium y se pasa a JPEG.
    1. Abre este archivo en Chromium con viewport 1200×630 y captura PNG (sin fullPage).
    2. convert og-docs.png -strip -quality 82 -sampling-factor 4:2:0 public/img/og-docs.jpg
  Debe quedar < 200 KB. Colores = tokens de public/css/input.css; sin fuentes externas.
-->
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<title>og-docs</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #faf6ee; color: #1c1917;
    font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 560px 1fr; gap: 56px;
    padding: 64px 72px; position: relative;
  }
  body::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 12px; background: #d7263d; }
  .left { display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; }
  h1 span { color: #b31f33; }
  .sub { font-size: 27px; line-height: 1.35; color: #5a524b; margin-top: 24px; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; }
  .chips b { font-size: 19px; font-weight: 600; padding: 7px 14px; border: 2px solid #e4dccd; border-radius: 999px; background: #fffdf9; }
  .term { align-self: center; background: #16120f; border-radius: 20px; padding: 28px 30px 32px; color: #f5efe6;
          font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 19px; line-height: 1.6;
          box-shadow: 0 24px 0 -8px #e4dccd; }
  .term div { white-space: pre; }
  .dots { display: flex; gap: 10px; margin-bottom: 20px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: #3e342d; }
  .p { color: #ff7a85; } .c { color: #8c8279; } .g { color: #facc15; } .k { color: #9ad1a4; }
</style>
</head>
<body>
  <section class="left">
    <div class="brand">
      <svg width="56" height="56" viewBox="0 0 80 80" fill="none" aria-hidden="true">
        <ellipse cx="40" cy="42" rx="28" ry="24" fill="#a0182c"/>
        <ellipse cx="40" cy="38" rx="28" ry="22" fill="#d7263d"/>
        <ellipse cx="28" cy="36" rx="8" ry="6.3" fill="#fff" stroke="#f2b705" stroke-width="1.8"/>
        <ellipse cx="52" cy="36" rx="8" ry="6.3" fill="#fff" stroke="#f2b705" stroke-width="1.8"/>
        <circle cx="28.6" cy="36.4" r="5.2" fill="#a97142"/><circle cx="52.6" cy="36.4" r="5.2" fill="#a97142"/>
        <circle cx="28.6" cy="36.4" r="2.6" fill="#3b2412"/><circle cx="52.6" cy="36.4" r="2.6" fill="#3b2412"/>
        <circle cx="30.2" cy="34.9" r="1.9" fill="#fff"/><circle cx="54.2" cy="34.9" r="1.9" fill="#fff"/>
        <path d="M40 18 L40 26" stroke="#f2b705" stroke-width="2" stroke-linecap="round"/>
        <path d="M36 19 L40 26 L44 19" stroke="#f2b705" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      MailMask
    </div>
    <div>
      <h1>Documentación <span>de MailMask</span></h1>
      <p class="sub">Crea direcciones, buzones y dominios desde tu código, tu terminal o tu agente.</p>
    </div>
    <div class="chips"><b>Skills</b><b>SDK</b><b>CLI</b><b>API REST</b><b>SMTP</b><b>MCP</b></div>
  </section>
  <section class="term" aria-hidden="true">
    <div class="dots"><i></i><i></i><i></i></div>
    <div><span class="p">$</span> mailmask login</div>
    <div class="c">✔ sesión iniciada</div>
    <div>&nbsp;</div>
    <div><span class="p">$</span> mailmask aliases create \</div>
    <div>&nbsp;&nbsp;acme.com ventas ana@acme.com \</div>
    <div>&nbsp;&nbsp;<span class="g">--mailbox</span></div>
    <div class="k">✔ ventas@acme.com</div>
    <div class="c">  contraseña: ab••••••yz</div>
  </section>
</body>
</html>
