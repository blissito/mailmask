# Producción vive en sandbox-host (fierro A, caja app-host) desde 2026-10-08: este workflow sólo
# publica la imagen en GHCR; la caja la jala sola (app-deploy.timer, ≤60 s) con salud y rollback.
# Construir aquí cumple la regla del CLAUDE.md: siempre desde HEAD limpio, nunca del árbol local.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Imagen a GHCR
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/blissito/mailmask:${{ github.sha }}
            ghcr.io/blissito/mailmask:main
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La caja confirma el rollout: /version devuelve el SHA del build. Antes del corte de DNS
      # todavía responde Fly ("dev"), así que el paso sólo avisa sin fallar.
      - name: Wait for rollout
        run: |
          for i in $(seq 1 50); do
            v=$(curl -fsS -m 5 https://www.mailmask.studio/version 2>/dev/null || true)
            [ "$v" = "${{ github.sha }}" ] && { echo "prod en ${{ github.sha }}"; exit 0; }
            sleep 6
          done
          echo "::warning::prod no reporta ${{ github.sha }} (revisa journalctl -u app-deploy en la caja)"
