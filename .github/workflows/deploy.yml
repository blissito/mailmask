# Producción vive en sandbox-host (fierro A, caja app-host) desde 2026-10-08: este workflow sólo
# publica la imagen en GHCR; la caja la jala sola (app-deploy.timer, ≤60 s) con salud y rollback.
# Construir aquí cumple la regla del CLAUDE.md: siempre desde HEAD limpio, nunca del árbol local.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Imagen a GHCR
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/blissito/mailmask:${{ github.sha }}
            ghcr.io/blissito/mailmask:main
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La caja confirma el rollout: /version devuelve el SHA del build. Si no aparece en ~5 min
      # (50×6 s, más hasta 5 s por curl) el rollout no llegó: la caja hace rollback y se queda con
      # la imagen anterior, así que el paso falla en vez de avisar.
      - name: Wait for rollout
        run: |
          last="sin respuesta"
          for i in $(seq 1 50); do
            v=$(curl -fsS -m 5 https://www.mailmask.studio/version 2>/dev/null || true)
            [ -n "$v" ] && last="$v"
            [ "$v" = "${{ github.sha }}" ] && { echo "prod en ${{ github.sha }}"; exit 0; }
            sleep 6
          done
          echo "::error::prod no reporta ${{ github.sha }} tras ~5 min; prod está sirviendo: $last. La caja app-host no publicó la imagen nueva (rollback): revisa journalctl -u app-deploy en la caja."
          exit 1
