# CI de la Software Factory de Ghosty. Lo exige la protección de la rama principal.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc sobre el servidor (tsconfig.json: los *.ts de la raíz)
      - run: npm run typecheck
      - run: npm run lint --if-present
      # data/ está en .gitignore y better-sqlite3 no crea el directorio solo (ver test-setup.mjs)
      - run: mkdir -p data
      - run: npm test
      # CSS + bundles de public/js + skills: sólo comprueba que compilan, no se commitea nada
      - run: npm run build
  verify-cli:
    # cli/ es su propio paquete (depende de @easybits.cloud/mailmask vía npm), no un workspace del
    # root: necesita su propio install. Antes de este job, el `npm test` del root ya se topaba con
    # cli/test/*.test.ts por el discovery recursivo de node:test y tronaba con ERR_MODULE_NOT_FOUND.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    # La misma imagen que despliega Fly (Dockerfile), construida sin push en cada PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Requiere 'Dependency graph' activado en Settings → Code security del repo;
      # mientras no se active, dependency-review-action falla con un error de configuración,
      # no por una dependencia riesgosa. continue-on-error hasta que se active.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        continue-on-error: true
        with:
          fail-on-severity: high
