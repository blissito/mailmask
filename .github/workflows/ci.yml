# CI de la Software Factory de Ghosty. Lo exige la protección de la rama principal.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc sobre el servidor (tsconfig.json: los *.ts de la raíz)
      - run: npm run typecheck
      - run: npm run lint --if-present
      # data/ está en .gitignore y better-sqlite3 no crea el directorio solo (ver test-setup.mjs)
      - run: mkdir -p data
      - run: npm test
      # CSS + bundles de public/js + skills: sólo comprueba que compilan, no se commitea nada
      - run: npm run build
  verify-cli:
    # cli/ es su propio paquete (depende de @easybits.cloud/mailmask vía npm), no un workspace del
    # root: necesita su propio install. Antes de este job, el `npm test` del root ya se topaba con
    # cli/test/*.test.ts por el discovery recursivo de node:test y tronaba con ERR_MODULE_NOT_FOUND.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    # La misma imagen que despliega Fly (Dockerfile), construida sin push en cada PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Requiere 'Dependency graph' activado en Settings → Code security del repo;
      # mientras no se active, dependency-review-action falla con un error de configuración,
      # no por una dependencia riesgosa. continue-on-error hasta que se active.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        continue-on-error: true
        with:
          fail-on-severity: high
