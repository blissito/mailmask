# Actualizaciones de dependencias (Software Factory de Ghosty). Agrupadas y semanales para no llenar de PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # citty >=0.2 cambia el tipado de los args (llegan como string | undefined) y deja
    # verify-cli en rojo: queda ignorada hasta migrar la CLI (issue #55).
    ignore:
      - dependency-name: "citty"
        versions: [">=0.2.0"]
  - package-ecosystem: npm
    directory: "/sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
